<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <link rel="stylesheet" href="{% static 'css/forgot_password.css' %}">

</head>
<body>

<div class="container">

    <div class="card">

        <h2>Forgot Password</h2>

        <p>
            Enter your registered email address to continue.
        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="input-group">
                <label>Email Address</label>
                <input type="email"
                       name="email"
                       placeholder="Enter your registered email"
                       required>
            </div>

            <button type="submit">
                Continue
            </button>

        </form>

        <a href="{% url 'user_login' %}" class="back">
            ← Back to Login
        </a>
<!--        <a href="{% url 'staff_login' %}" class="back">-->
<!--            ← Back to Staff_Login-->
<!--        </a>-->
<!--        <a href="{% url 'admin_login' %}" class="back">-->
<!--            ← Back to Admin_Login-->
        </a>

    </div>

</div>

</body>
</html>
