{% extends 'base.html' %}
{% load static %}

{% block title %}Forgot Password - KQMS{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/forgot_password.css' %}">
{% endblock %}

{% block content %}
<div class="container" style="min-height: 65vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
    <div class="card" style="max-width: 440px; width: 100%;">
        <h2>Forgot Password</h2>
        <p style="color: #64748b; margin-bottom: 20px;">
            Enter your registered email address to continue password reset.
        </p>

        <form method="POST">
            {% csrf_token %}
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="Enter your registered email" required>
            </div>
            <button type="submit" style="margin-top: 15px;">Continue</button>
        </form>

        <a href="{% url 'user_login' %}" class="back" style="display: inline-block; margin-top: 15px;">
            ← Back to Login
        </a>
    </div>
</div>
{% endblock %}
