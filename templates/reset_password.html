<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>

    <link rel="stylesheet" href="{% static 'css/reset_password.css' %}">

</head>
<body>

<div class="container">

    <div class="card">

        <h2>Reset Password</h2>

        <form method="POST">

            {% csrf_token %}

            <div class="input-group">
                <label>New Password</label>
                <input type="password"
                       name="new_password"
                       placeholder="Enter new password"
                       required>
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password"
                       name="confirm_password"
                       placeholder="Confirm new password"
                       required>
            </div>

            <button type="submit">
                Reset Password
            </button>

        </form>

        <a href="{% url 'user_login' %}" class="back">
            ← Back to Login
        </a>
<!--        <a href="{% url 'staff_login' %}" class="back">-->
<!--            ← Back to Staff_Login-->
<!--        </a>-->
<!--        <a href="{% url 'admin_login' %}" class="back">-->
<!--            ← Back to Admin_Login-->
        </a>
    </div>

</div>

</body>
</html>
