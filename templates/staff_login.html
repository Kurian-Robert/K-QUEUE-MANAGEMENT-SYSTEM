{% extends 'base.html' %}
{% load static %}

{% block title %}Staff Login - KQMS{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/staff_login.css' %}">
{% endblock %}

{% block content %}
<div class="login-container" style="min-height: 65vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
    <div class="login-box" style="max-width: 440px; width: 100%;">
        <h2>Staff Login</h2>
        <p class="subtitle">Kerala Queue Management System</p>

        <form method="POST">
            {% csrf_token %}
            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter Staff Username" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter Password" required>
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>

        <div class="links">
            <p>New Staff?</p>
            <a href="{% url 'staff_register' %}">Create Account</a>
        </div>
    </div>
</div>
{% endblock %}
