<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login</title>

    <link rel="stylesheet" href="{% static 'css/staff_login.css' %}">

</head>
<body>

<div class="login-container">

    <div class="login-box">

        <h2>Staff Login</h2>
        <p class="subtitle">Kerala Queue Management System</p>

        <form method="POST">

            {% csrf_token %}

            <div class="input-group">
                <label>Username</label>
                <input
                    type="text"
                    name="username"
                    placeholder="Enter Username"
                    required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Enter Password"
                    required>
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div class="links">
            <p>New Staff?</p>
            <a href="{% url 'staff_register' %}">Create Account</a>
        </div>

    </div>

</div>

</body>
</html>
