{% extends 'base.html' %}
{% load static %}

{% block title %}Staff Registration - KQMS{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/staff_register.css' %}">
{% endblock %}

{% block content %}
<div class="register-container" style="min-height: 75vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
    <div class="register-box" style="max-width: 480px; width: 100%;">
        <h2>Staff Registration</h2>
        <p class="subtitle">Kerala Queue Management System</p>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter Staff Username" required>
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="Enter Email" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter Password" required>
            </div>

            <div class="input-group">
                <label>Phone Number</label>
                <input type="text" name="phone" placeholder="Enter Phone Number" required>
            </div>

            <div class="input-group">
                <label>Designation</label>
                <input type="text" name="designation" placeholder="e.g. Counter Officer" required>
            </div>

            <div class="input-group">
                <label>Department</label>
                <select name="department" required>
                    <option value="">-- Select Department --</option>
                    {% for department in departments %}
                    <option value="{{ department.department_id }}">
                        {{ department.department_name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="input-group">
                <label>Profile Picture</label>
                <input type="file" name="picture">
            </div>

            <button type="submit" class="register-btn">Register</button>
        </form>

        <div class="links">
            <p>Already have an account?</p>
            <a href="{% url 'staff_login' %}">Login</a>
        </div>
    </div>
</div>
{% endblock %}
