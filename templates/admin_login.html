{% extends 'base.html' %}
{% load static %}

{% block title %}Admin Login - KQMS{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/admin_login.css' %}?v=2">
{% endblock %}

{% block content %}
<div style="min-height: 65vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
    <div class="login-box">
        <h2>Admin Login</h2>
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p>
            Don't have an account? <a href="{% url 'admin_register' %}">Register</a>
        </p>
    </div>
</div>
{% endblock %}
