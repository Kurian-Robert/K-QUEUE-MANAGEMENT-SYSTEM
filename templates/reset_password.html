{% extends 'base.html' %}
{% load static %}

{% block title %}Reset Password - KQMS{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/reset_password.css' %}">
{% endblock %}

{% block content %}
<div class="container" style="min-height: 65vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
    <div class="card" style="max-width: 440px; width: 100%;">
        <h2>Reset Password</h2>
        <p style="color: #64748b; margin-bottom: 20px;">
            Set your new account credentials.
        </p>

        <form method="POST">
            {% csrf_token %}
            <div class="input-group">
                <label>New Password</label>
                <input type="password" name="new_password" placeholder="Enter new password" required>
            </div>

            <div class="input-group" style="margin-top: 15px;">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" placeholder="Confirm new password" required>
            </div>

            <button type="submit" style="margin-top: 20px;">Reset Password</button>
        </form>

        <a href="{% url 'user_login' %}" class="back" style="display: inline-block; margin-top: 15px;">
            ← Back to Login
        </a>
    </div>
</div>
{% endblock %}
